name: publish
on:
  # Fire as soon as the portrait job finishes, so a new 立繪 is live straight
  # away instead of waiting for a cron slot the scheduler is running hours late.
  workflow_run:
    workflows: ["portrait"]
    types: [completed]
  # Safety net: if the portrait job's own schedule ever stops, the site still
  # picks up catalog and asset changes on its own once an hour.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    # workflow_run also fires when portrait fails, and there is nothing to
    # publish in that case.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Check out the exact commit the portrait job produced, not whatever the
      # default branch happens to point at when this run starts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # actions/checkout only brings the source; the build needs the project's
      # own dependencies, or vite.config cannot resolve @tailwindcss/vite and
      # friends. npx would otherwise fetch a stray vite and fail on the plugins.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the static site
        run: npx vite build -c vite.pages.config.ts
      # The Pages repository is the live site and deploys itself on push, so this
      # only has to put the build output there. Needs a token scoped to that one
      # repository -- a full-scope classic token would be far too much to store.
      - name: Check for the Pages token
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -z "$PAGES_TOKEN" ]; then
            echo "::error::PAGES_TOKEN is not set. Create a fine-grained token with"
            echo "::error::Contents: Read and write on yip-lgtm/yip-lgtm.github.io only,"
            echo "::error::then add it as a repository secret named PAGES_TOKEN."
            exit 1
          fi
      # Selective on purpose. This repository owns the catalog and the portraits,
      # and those are the only things copied over.
      #
      # feed.json, daily.json and war-index.json stay where they are: the Pages
      # workflows append a campaign and a dossier to feed.json every hour and the
      # daily-script rewrites daily.json, so this repository's copies are hours
      # behind. Copying them would revert that work -- measured at 44KB against
      # 86KB, with two campaigns and a two-day rollback already on record.
      - name: Publish the build and the portraits
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: yip-lgtm/yip-lgtm.github.io
        run: |
          set -euo pipefail
          # Ask for the token through a helper instead of embedding it in the URL.
          # A failed clone echoes the remote back, which would print the token into
          # the run log.
          cat > "$RUNNER_TEMP/askpass.sh" <<'SH'
          #!/bin/sh
          echo "$PAGES_TOKEN"
          SH
          chmod +x "$RUNNER_TEMP/askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh" GIT_TERMINAL_PROMPT=0
          git config --global --add safe.directory "$RUNNER_TEMP/pages"
          git clone --depth 1 "https://github.com/${PAGES_REPO}.git" pages
          cd pages

          # The bundle is re-hashed every build, so clear the old one rather than
          # leaving an orphan being served from the live site.
          rm -rf cute/assets
          cp -r ../dist-pages/assets cute/assets

          # vite names the entry pages.html; GitHub Pages serves index.html.
          cp ../dist-pages/pages.html cute/index.html

          rm -rf cute/portraits
          cp -r ../dist-pages/portraits cute/portraits

          git config user.name "yip-lmt"
          git config user.email "258986088+yip-lmt@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -q -m "cute: publish build and portraits from steel-and-will"
          git push
          rm -f "$RUNNER_TEMP/askpass.sh"
          echo "published; GitHub Pages will build it in a minute or two"